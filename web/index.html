<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflows</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles/font.css"><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="app.css"></head><body>
<div id="app"><aside id="sidebar"><header class="library-head"><img src="icon.svg" alt=""><strong>Workflows</strong><button id="new" class="icon" aria-label="New workflow">＋</button><button id="close-library" class="icon" aria-label="Close workflow library">×</button></header><input id="filter" type="search" aria-label="Filter workflows" placeholder="Find a workflow…"><div id="library" role="list" aria-label="Shared workflows"></div><footer><span class="dot"></span><span id="connection">Connecting…</span><button id="all-runs" class="quiet">All runs</button></footer></aside><button id="library-backdrop" aria-label="Close workflow library" hidden></button>
<main><header class="main-head"><button id="toggle-library" class="icon" aria-label="Toggle workflow library">☰</button><div id="breadcrumb">Shared workspace</div><span class="spacer"></span><span id="sync" role="status"></span><button id="save" disabled>Save</button><button id="run" class="primary" disabled>▶ Run</button></header><div id="notice" role="status" hidden><span></span><button id="reload" hidden>Reload shared version</button><button id="dismiss" class="icon" aria-label="Dismiss notice">×</button></div><nav id="tabs" aria-label="Workflow sections"><button id="steps-tab" class="selected">Steps</button><button id="runs-tab">Runs</button><span class="spacer"></span><button id="duplicate" class="quiet" disabled>Duplicate</button><button id="archive" class="quiet" disabled>Archive</button></nav><section id="workspace"></section></main></div>
<dialog role="dialog" id="command-dialog"><header><strong>Add an app command</strong><span class="spacer"></span><button id="close-command" class="icon" aria-label="Close command chooser">×</button></header><input id="command-search" type="search" aria-label="Search app commands" placeholder="Search apps and commands…"><div id="command-list" role="list"></div><footer>Window-opening commands stay in the system command palette.</footer></dialog>
<dialog role="dialog" id="run-dialog"><header><strong id="run-title">Run workflow</strong><span class="spacer"></span><button id="close-run" class="icon" aria-label="Close run preview">×</button></header><form id="run-form"><div id="run-inputs"></div><button id="review" type="submit">Review run</button></form><div id="run-preview" hidden></div><footer id="run-footer" hidden><label id="approval-label"><input id="approval" type="checkbox">I approve these changes and any provider credit charges.</label><p>Runs continue after this window closes. Cancelling lets the current app request finish.</p><button id="start-run" class="primary">Run workflow</button></footer><p id="run-error" role="status"></p></dialog>
<script type="module" src="app.mjs"></script></body></html>
